[project]
name = "jobscout"
version = "0.1.0"
description = "Job scraping and analysis pipeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "openai>=3.57.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "psycopg2-binary>=2.9.13",
    "sqlalchemy>=2.1.9",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "tenacity>=9.2.1",
    "redis>=8.1.0",
    "rq>=3.0.0",
    "lxml>=6.1.2",
    "python-docx>=1.2.0",
    "pypdf>=7.1.1",
    "xxhash>=4.1.0",
    "prometheus-client>=0.26.0",
]

[dependency-groups]
dev = [
    "numpy>=2.4.1",
    "pytest>=9.2.0",
    "testcontainers>=4.15.0",
    "jsonschema>=4.26.0",
    "vulture>=2.16",
    "reportlab>=4.0.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "httpx2>=2.16.2",
]
web = [
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
    "pydantic>=2.14.4",
    "python-multipart>=0.0.32",
    "slowapi>=0.1.10",
    "python-dotenv>=1.2.4",
]
fit-models = [
    # Cross-encoder triplet pinned to a known-good combination. FlagEmbedding
    # and sentence-transformers both pull in transformers; we pin it explicitly
    # so the reranker route does not silently degrade when a transitive bump
    # breaks FlagAutoReranker or CrossEncoder import paths.
    "FlagEmbedding==1.4.2",
    "sentence-transformers==6.1.0",
    "transformers==5.23.0",
    "huggingface-hub>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "core", "database", "etl", "notification",
    "services", "modal", "web"
]

[tool.uv]
default-groups = ["dev", "web"]
constraint-dependencies = [
    "aiohttp>=3.14.3",
    # Transformers 5.23 requires PEFT 0.20+ for its adapter integration.
    "peft>=0.20.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# Keep the established lint policy explicit across Ruff's expanded defaults.
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    ".venv/*",
    "scripts/*",
    "migrations/*",
    "*.egg-info/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "integration_test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
log_cli_level = "DEBUG"
log_level = "DEBUG"
filterwarnings = [
    "ignore::RuntimeWarning:asyncio",
    "ignore:coroutine 'AsyncMockMixin.*was never awaited",
    "ignore::DeprecationWarning:testcontainers",
]
