name: Import reviewed Dependabot commit objects

on:
  push:
    branches:
      - automation/dependabot-import-2026-11-23
    paths:
      - .github/workflows/import-dated-commits.yml
      - .github/scripts/dependabot-import/import_commits.py
      - .github/scripts/dependabot-import/test_import_commits.py
      - .github/scripts/dependabot-import/manifest.json
      - .github/scripts/dependabot-import/policy.json

permissions: {}

concurrency:
  group: jobscout-dependabot-commit-object-import-2026-11-23
  cancel-in-progress: false

jobs:
  import-objects:
    if: github.repository == 'sahnsookyung/JobScout' && github.ref == 'refs/heads/automation/dependabot-import-2026-11-23' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the exact triggering commit on the approved helper branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Run offline importer tests
        run: python3 -I -m unittest discover -s .github/scripts/dependabot-import -p test_import_commits.py -v
      - name: Validate the complete sealed history without network access
        run: >-
          python3 -I .github/scripts/dependabot-import/import_commits.py
          --manifest .github/scripts/dependabot-import/manifest.json
          --policy .github/scripts/dependabot-import/policy.json
          --policy-sha256 519267807d94db120aec62daefcf5bc7e0fc8a03014092c94fc7e47004ed4a7c
          --validate-only
      - name: Create and verify only the sealed commit objects
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 -I .github/scripts/dependabot-import/import_commits.py
          --manifest .github/scripts/dependabot-import/manifest.json
          --policy .github/scripts/dependabot-import/policy.json
          --policy-sha256 519267807d94db120aec62daefcf5bc7e0fc8a03014092c94fc7e47004ed4a7c
          --create-objects
